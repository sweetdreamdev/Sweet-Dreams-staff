# Guárdalo en tu repositorio como:  .github/workflows/mantener-activo.yml
# Cada 3 días consulta Supabase para que el proyecto gratuito no se pause por inactividad.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 6 */3 * *"     # cada 3 días a las 06:17 UTC
  workflow_dispatch:           # también se puede lanzar a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          curl --fail --silent --show-error -X POST \
            "https://lpflycvomagkudyqsaug.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_LEkhPHD4mKJJFzIbPXBNeQ_e06arFQx" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Supabase respondió correctamente"
