<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de Staff · Reportes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { display: ['Rajdhani', 'sans-serif'], body: ['Barlow', 'sans-serif'] },
    colors: { base: '#0d0f1a', panel: '#151827', raised: '#1e2236', line: '#2a2f48', fx: '#ff7a1a' }
  } } };
</script>
<style>
  body { font-family: 'Barlow', sans-serif; background: #0d0f1a; }
  .bg-scene {
    background:
      radial-gradient(700px 380px at 12% -5%, rgba(255,122,26,.16), transparent 70%),
      radial-gradient(600px 400px at 100% 0%, rgba(99,102,241,.10), transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 44px 44px;
  }
  .card { transition: border-color .2s, transform .2s, box-shadow .2s; }
  .card:hover { border-color: rgba(var(--c), .55); box-shadow: 0 10px 30px -12px rgba(var(--c), .35); }
  :focus-visible { outline: 2px solid #ff7a1a; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<div class="min-h-screen bg-scene md:flex">
  <!-- ============ BARRA LATERAL ============ -->
  <aside class="md:w-64 md:h-screen md:sticky md:top-0 bg-panel/80 backdrop-blur border-b md:border-b-0 md:border-r border-line flex flex-col">
    <div class="flex items-center gap-3 px-5 py-4 md:py-6">
      <div class="w-10 h-10 rounded-lg bg-fx grid place-items-center shadow-lg shadow-orange-500/30">
        <svg viewBox="0 0 24 24" class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4V4z"/><path d="M8 9h8M8 12h5"/></svg>
      </div>
      <div>
        <div class="font-display text-2xl font-bold text-white leading-none">Reportes</div>
        <div class="text-xs text-slate-400 mt-1">Panel del staff</div>
      </div>
    </div>
    <nav id="tabs" class="flex md:flex-col gap-1 px-3 pb-3 md:pb-0 overflow-x-auto" aria-label="Filtrar reportes"></nav>
    <div id="live-box" class="hidden md:flex mt-auto m-4 items-center gap-2 text-xs text-slate-400 bg-base/60 border border-line rounded-lg px-3 py-2.5">
      <span id="live-dot" class="w-2 h-2 rounded-full bg-slate-500"></span><span id="live">Conectando…</span>
    </div>
  </aside>

  <!-- ============ CONTENIDO ============ -->
  <main class="flex-1 p-4 md:p-8 max-w-5xl w-full">
    <div id="error" class="hidden mb-6 rounded-lg border border-red-500/40 bg-red-500/10 text-red-200 text-sm px-4 py-3"></div>
    <div id="demo" class="hidden mb-6 rounded-lg border border-amber-500/40 bg-amber-500/10 text-amber-200 text-sm px-4 py-3">
      Estás viendo reportes de ejemplo. Cuando pongas tu URL y tu clave de Supabase en el archivo, aquí aparecerán los reportes reales.
    </div>

    <section class="grid grid-cols-3 gap-3 mb-8" aria-label="Resumen">
      <div class="bg-panel/80 border border-line rounded-xl px-4 py-3"><div id="n-pend" class="font-display text-4xl font-bold text-white leading-none">0</div><div class="text-sm text-slate-400 mt-1 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-slate-400"></span>Pendientes</div></div>
      <div class="bg-panel/80 border border-line rounded-xl px-4 py-3"><div id="n-rev" class="font-display text-4xl font-bold text-white leading-none">0</div><div class="text-sm text-slate-400 mt-1 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-violet-400"></span>En revisión</div></div>
      <div class="bg-panel/80 border border-line rounded-xl px-4 py-3"><div id="n-res" class="font-display text-4xl font-bold text-white leading-none">0</div><div class="text-sm text-slate-400 mt-1 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>Resueltos</div></div>
    </section>

    <header class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <h1 id="titulo-vista" class="font-display text-4xl font-bold text-white leading-none">Todos</h1>
      <label class="flex items-center gap-2 text-sm text-slate-400">Orden
        <select id="orden" class="bg-panel border border-line rounded-lg px-3 py-2 text-slate-200 focus:border-fx focus:outline-none">
          <option value="prioridad">Más urgentes primero</option>
          <option value="recientes">Más recientes primero</option>
        </select>
      </label>
    </header>

    <div id="lista" class="grid gap-5"></div>
  </main>
</div>

<div id="toast" class="fixed bottom-5 right-5 bg-raised border border-line text-sm px-4 py-2.5 rounded-lg shadow-xl hidden z-50"></div>

<script>
// ================= CONFIGURACIÓN =================
const SUPABASE_URL = "https://lpflycvomagkudyqsaug.supabase.co";
const SUPABASE_KEY = "sb_secret_fLuQpILsg2EclVajy_I6GQ_BMrQovoS";
// =================================================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Mientras no cambies la URL, el panel muestra reportes de ejemplo
const DEMO = SUPABASE_URL.includes("TU-PROYECTO") || SUPABASE_KEY.includes("TU_ANON");
let db = null, errorInicial = null;
if (!DEMO) {
  try {
    const url = SUPABASE_URL.trim().replace(/\/+$/, "");
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))
      throw new Error("La URL de Supabase no es válida. Debe ser como https://abcdefgh.supabase.co (sin /rest/v1 ni nada detrás).");
    if (typeof supabase === "undefined")
      throw new Error("No se pudo cargar la librería de Supabase. Revisa tu conexión o desactiva el bloqueador de anuncios.");
    db = supabase.createClient(url, SUPABASE_KEY.trim());
  } catch (e) { errorInicial = e.message; }
}

function mostrarError(msg) {
  $("error").innerHTML = "<strong>No se pudo conectar con Supabase.</strong><br>" + esc(msg);
  $("error").classList.remove("hidden");
  estadoConexion("Sin conexión", "bg-red-500");
}

const ESTADOS = ["Pendiente", "En revisión", "Resuelto"];
const ESTADO_ESTILO = {
  "Pendiente":   { on: "bg-slate-500 text-white",      dot: "bg-slate-400" },
  "En revisión": { on: "bg-violet-500 text-white",     dot: "bg-violet-400" },
  "Resuelto":    { on: "bg-emerald-500 text-slate-950", dot: "bg-emerald-400" }
};
const TIPOS = {
  "Queja": { rgb: "239,68,68",  badge: "bg-red-500/15 text-red-300 ring-red-500/40",          dot: "bg-red-500" },
  "Bug":   { rgb: "250,204,21", badge: "bg-yellow-400/15 text-yellow-300 ring-yellow-400/40", dot: "bg-yellow-400" },
  "Otro":  { rgb: "59,130,246", badge: "bg-blue-500/15 text-blue-300 ring-blue-500/40",       dot: "bg-blue-500" }
};
const VISTAS = [
  { id: "Todos", label: "Todos", dot: "bg-slate-400" },
  { id: "Queja", label: "Quejas", dot: TIPOS.Queja.dot },
  { id: "Bug",   label: "Bugs",   dot: TIPOS.Bug.dot },
  { id: "Otro",  label: "Otros",  dot: TIPOS.Otro.dot }
];
const SEMANA = 7 * 24 * 60 * 60 * 1000;

let reportes = [], filtro = "Todos", orden = "prioridad", canal = null;


function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.add("hidden"), 3500);
}

function estadoConexion(texto, color) {
  $("live").textContent = texto;
  $("live-dot").className = "w-2 h-2 rounded-full " + color;
}

// ---------- Datos ----------
function datosDemo() {
  const ahora = Date.now(), min = 60000, dia = 24 * 60 * min;
  const f = ms => new Date(ahora - ms).toISOString();
  return [
    { id: 5, created_at: f(25 * min),  tipo_reporte: "Bug",   usuario_discord: "Rafa_Driver#2041", estado: "Pendiente",
      titulo: "Los coches desaparecen al salir del garaje",
      descripcion: "Al sacar un vehículo del garaje de Legion Square se queda invisible unos segundos y luego aparece en otro sitio. Me ha pasado 3 veces seguidas.",
      pruebas: "https://www.youtube.com/watch?v=ejemplo" },
    { id: 4, created_at: f(1.4 * dia), tipo_reporte: "Queja", usuario_discord: "LunaRP#7788", estado: "En revisión",
      titulo: "Policía sin rol en el control de la autopista",
      descripcion: "Dos agentes me multaron sin dar ninguna explicación y sin usar /me. Creo que rompieron las normas de rol, adjunto el clip.",
      pruebas: "https://streamable.com/ejemplo" },
    { id: 3, created_at: f(3.2 * dia), tipo_reporte: "Otro",  usuario_discord: "Marco_V#1203", estado: "Pendiente",
      titulo: "Sugerencia: nuevo trabajo de mecánico",
      descripcion: "Estaría bien un trabajo de mecánico con taller propio y piezas para tunear. Hay muchos jugadores interesados.",
      pruebas: null },
    { id: 2, created_at: f(6.3 * dia), tipo_reporte: "Bug",   usuario_discord: "Nico.Fx#9012", estado: "Pendiente",
      titulo: "El inventario se queda bloqueado",
      descripcion: "Después de abrir el maletero de un coche el inventario no responde y hay que reconectar. Pasa solo con coches deportivos.",
      pruebas: "https://imgur.com/ejemplo" },
    { id: 1, created_at: f(9 * dia),   tipo_reporte: "Queja", usuario_discord: "Sofi_RP#3345", estado: "Resuelto",
      titulo: "Cobro doble en la tienda 24/7",
      descripcion: "Me cobraron dos veces una compra de 350$. Ya me lo devolvieron, gracias al staff por la rapidez.",
      pruebas: null }
  ];
}

async function cargar() {
  if (DEMO) {
    reportes = datosDemo();
    $("demo").classList.remove("hidden");
    estadoConexion("Modo demostración", "bg-amber-400");
    render();
    return;
  }
  if (errorInicial) { mostrarError(errorInicial); return; }
  try {
    const consulta = db.from("reportes").select("*").order("created_at", { ascending: false });
    const espera = new Promise((_, rej) => setTimeout(() => rej(new Error("Supabase no responde (10 s). Revisa la URL y que el proyecto no esté pausado.")), 10000));
    const { data, error } = await Promise.race([consulta, espera]);
    if (error) throw new Error(error.message + (error.code === "42501" || /permission|policy/i.test(error.message) ? " Falta la política de lectura (select) para anon: ejecuta el SQL de permisos." : ""));
    reportes = data;
    $("error").classList.add("hidden");
    render();
    suscribir();
  } catch (e) { mostrarError(e.message); }
}

function suscribir() {
  canal = db.channel("reportes-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "reportes" }, p => {
      if (p.eventType === "INSERT") {
        if (!reportes.some(r => r.id === p.new.id)) reportes.unshift(p.new);
      } else if (p.eventType === "UPDATE") {
        reportes = reportes.map(r => r.id === p.new.id ? p.new : r);
      } else if (p.eventType === "DELETE") {
        reportes = reportes.filter(r => r.id !== p.old.id);
      }
      render();
    })
    .subscribe(st => st === "SUBSCRIBED" ? estadoConexion("En vivo", "bg-emerald-400") : estadoConexion("Reconectando…", "bg-slate-500"));
}

async function cambiarEstado(id, estado) {
  const r = reportes.find(x => x.id === id);
  if (!r || r.estado === estado) return;
  const anterior = r.estado;
  r.estado = estado; render();
  if (DEMO) { toast("Reporte #" + id + " marcado como " + estado + " (solo demostración)"); return; }
  const { error } = await db.from("reportes").update({ estado }).eq("id", id);
  if (error) { r.estado = anterior; render(); toast("No se pudo cambiar el estado: " + error.message); }
  else toast("Reporte #" + id + " marcado como " + estado);
}

// ---------- Urgencia ----------
const urgencia = r => Math.min(1, Math.max(0, (Date.now() - new Date(r.created_at)) / SEMANA));

function hace(ms) {
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return "Hace " + d + (d === 1 ? " día" : " días");
  if (h >= 1) return "Hace " + h + (h === 1 ? " hora" : " horas");
  return m < 1 ? "Ahora mismo" : "Hace " + m + " min";
}

function barraHTML(r, resuelto) {
  const u = urgencia(r);
  const color = `hsl(${Math.round(210 * (1 - u))} 85% 55%)`;
  const texto = resuelto ? "Resuelto" : (u >= 1 ? "Más de una semana sin resolver" : hace(Date.now() - new Date(r.created_at)));
  return `
    <div class="${resuelto ? "opacity-40" : ""}" role="img" aria-label="Urgencia: ${esc(texto)}">
      <div class="relative h-2 rounded-full" style="background:linear-gradient(90deg,#3b82f6,#a855f7 50%,#ef4444)">
        <span class="absolute top-1/2 w-4 h-4 rounded-full border-2 border-white shadow-lg"
          style="left:${(u * 100).toFixed(1)}%;transform:translate(-50%,-50%);background:${color}"></span>
      </div>
      <div class="flex justify-between text-xs text-slate-500 mt-1.5">
        <span>Reciente</span><span class="text-slate-300">${esc(texto)}</span><span>1 semana</span>
      </div>
    </div>`;
}

// ---------- Render ----------
function pruebasHTML(texto) {
  const items = String(texto).split(/\s+/).filter(Boolean).map(t => {
    try {
      const u = new URL(t);
      if (u.protocol === "http:" || u.protocol === "https:") {
        return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer"
          class="inline-flex items-center gap-2 bg-fx/10 text-fx border border-fx/30 hover:bg-fx/20 rounded-lg px-3 py-1.5 text-sm font-medium transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          Ver prueba</a>`;
      }
    } catch (_) {}
    return `<span class="text-sm text-slate-400 break-all">${esc(t)}</span>`;
  });
  return `<div class="flex flex-wrap items-center gap-2">${items.join("")}</div>`;
}

function tarjeta(r) {
  const tipo = TIPOS[r.tipo_reporte] || TIPOS.Otro;
  const estado = ESTADOS.includes(r.estado) ? r.estado : "Pendiente";
  const fecha = new Date(r.created_at).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" });
  const botones = ESTADOS.map(e => `
    <button data-id="${r.id}" data-estado="${e}" aria-pressed="${e === estado}"
      class="estado-btn flex-1 sm:flex-none px-3.5 py-1.5 rounded-md text-sm font-medium transition-colors ${e === estado ? ESTADO_ESTILO[e].on : "text-slate-400 hover:text-white hover:bg-raised"}">${e}</button>`).join("");

  return `
  <article class="card relative overflow-hidden rounded-xl border border-line bg-panel p-5 sm:p-6" style="--c:${tipo.rgb}">
    <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(520px 160px at 0% 0%, rgba(${tipo.rgb},.14), transparent 70%)"></div>
    <div class="relative">
      <div class="flex flex-wrap items-center gap-2.5">
        <span class="px-3 py-1 rounded-full text-xs font-semibold ring-1 ${tipo.badge}">${esc(r.tipo_reporte || "Otro")}</span>
        <span class="inline-flex items-center gap-1.5 text-sm text-slate-300"><span class="w-2 h-2 rounded-full ${ESTADO_ESTILO[estado].dot}"></span>${estado}</span>
        <span class="ml-auto text-xs text-slate-500">#${esc(r.id)} · ${fecha}</span>
      </div>

      <h2 class="font-display text-[1.7rem] font-bold text-white leading-tight mt-4">${esc(r.titulo || "Sin título")}</h2>
      <div class="flex items-center gap-2.5 mt-2">
        <span class="w-7 h-7 rounded-full grid place-items-center text-xs font-bold text-black" style="background:rgb(${tipo.rgb})">${esc((r.usuario_discord || "?").charAt(0).toUpperCase())}</span>
        <span class="text-sm text-slate-200 font-medium">${esc(r.usuario_discord || "Anónimo")}</span>
      </div>

      <p class="mt-4 text-slate-300 leading-relaxed whitespace-pre-wrap break-words max-w-[68ch]">${esc(r.descripcion || "Sin descripción.")}</p>
      ${r.pruebas ? `<div class="mt-4">${pruebasHTML(r.pruebas)}</div>` : ""}

      <div class="mt-5">${barraHTML(r, estado === "Resuelto")}</div>

      <div class="mt-5 pt-5 border-t border-line flex flex-wrap items-center gap-3">
        <span class="text-sm text-slate-400">Estado</span>
        <div class="flex w-full sm:w-auto rounded-lg bg-base border border-line p-1 gap-1">${botones}</div>
      </div>
    </div>
  </article>`;
}

function render() {
  $("tabs").innerHTML = VISTAS.map(v => {
    const n = v.id === "Todos" ? reportes.length : reportes.filter(r => r.tipo_reporte === v.id).length;
    const activa = v.id === filtro;
    return `<button data-vista="${v.id}" aria-current="${activa}"
      class="tab flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-left whitespace-nowrap font-medium transition-colors md:w-full ${activa ? "bg-raised text-white ring-1 ring-line" : "text-slate-400 hover:text-white hover:bg-raised/60"}">
      <span class="w-2.5 h-2.5 rounded-full ${v.dot}"></span><span>${v.label}</span>
      <span class="ml-auto text-xs ${activa ? "text-fx" : "text-slate-500"}">${n}</span></button>`;
  }).join("");

  $("titulo-vista").textContent = VISTAS.find(v => v.id === filtro).label;
  $("n-pend").textContent = reportes.filter(r => (r.estado || "Pendiente") === "Pendiente").length;
  $("n-rev").textContent  = reportes.filter(r => r.estado === "En revisión").length;
  $("n-res").textContent  = reportes.filter(r => r.estado === "Resuelto").length;

  const visibles = (filtro === "Todos" ? reportes : reportes.filter(r => r.tipo_reporte === filtro)).slice();
  const cerrado = r => r.estado === "Resuelto" ? 1 : 0;
  visibles.sort((a, b) => orden === "prioridad"
    ? cerrado(a) - cerrado(b) || new Date(a.created_at) - new Date(b.created_at)
    : new Date(b.created_at) - new Date(a.created_at));

  $("lista").innerHTML = visibles.length
    ? visibles.map(tarjeta).join("")
    : `<div class="border border-dashed border-line rounded-xl p-12 text-center text-slate-400">No hay reportes en esta vista. Aparecerán aquí en cuanto alguien envíe el formulario.</div>`;
}

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { filtro = tab.dataset.vista; render(); return; }
  const btn = e.target.closest(".estado-btn");
  if (btn) cambiarEstado(Number(btn.dataset.id), btn.dataset.estado);
});
$("orden").addEventListener("change", e => { orden = e.target.value; render(); });

// ---------- Arranque ----------
$("live-box").classList.remove("hidden");
render();
cargar();
setInterval(render, 60000);
</script>
</body>
</html>
