<style>
  body { font-family: 'Barlow', sans-serif; background: #0d0f1a; }
  .bg-scene {
    background:
      radial-gradient(700px 380px at 12% -5%, rgba(255,122,26,.16), transparent 70%),
      radial-gradient(600px 400px at 100% 0%, rgba(99,102,241,.10), transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 44px 44px;
  }
  .card { transition: border-color .2s, transform .2s, box-shadow .2s; }
  .card:hover { border-color: rgba(var(--c), .55); box-shadow: 0 10px 30px -12px rgba(var(--c), .35); }
  .card-wrap { cursor: grab; }
  .card-wrap.drag-origen { opacity: .3; }
  .grip { touch-action: none; cursor: grab; }
  body.arrastrando, body.arrastrando * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
  .drag-ghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; opacity: .95;
    transform-origin: 20px 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.7); }
  .drag-ghost .card { border-color: #ff7a1a; }
  section[data-estado] { border-radius: 14px; transition: background .15s, box-shadow .15s; }
  section[data-estado].drop-activa { background: rgba(255,122,26,.08); box-shadow: 0 0 0 2px #ff7a1a; }
  :focus-visible { outline: 2px solid #ff7a1a; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

}

async function cargar() {
  if (DEMO) {
    reportes = datosDemo();
    $("demo").classList.remove("hidden");
    estadoConexion("Modo demostración", "bg-amber-400");
    render();
    return;
  }
  if (errorInicial) { mostrarError(errorInicial); return; }
  try {
    const consulta = db.from("reportes").select("*").order("created_at", { ascending: false });
    const espera = new Promise((_, rej) => setTimeout(() => rej(new Error("Supabase no responde (10 s). Revisa la URL y que el proyecto no esté pausado.")), 10000));
    const { data, error } = await Promise.race([consulta, espera]);
    if (error) throw new Error(error.message + (error.code === "42501" || /permission|policy/i.test(error.message) ? " Falta la política de lectura (select) para anon: ejecuta el SQL de permisos." : ""));
    reportes = data;
    $("error").classList.add("hidden");
    render();
    suscribir();
  } catch (e) { mostrarError(e.message); }
}

function suscribir() {
  canal = db.channel("reportes-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "reportes" }, p => {
      if (p.eventType === "INSERT") {
        if (!reportes.some(r => r.id === p.new.id)) reportes.unshift(p.new);
      } else if (p.eventType === "UPDATE") {
        reportes = reportes.map(r => r.id === p.new.id ? p.new : r);
      } else if (p.eventType === "DELETE") {
        reportes = reportes.filter(r => r.id !== p.old.id);
      }
      render();
    })
    .subscribe(st => st === "SUBSCRIBED" ? estadoConexion("En vivo", "bg-emerald-400") : estadoConexion("Reconectando…", "bg-slate-500"));
}

async function cambiarEstado(id, estado) {
  const r = reportes.find(x => x.id === id);
  if (!r || r.estado === estado) return;
  const anterior = r.estado;
  r.estado = estado; render();
  if (DEMO) { toast("Caso #" + id + " marcado como " + estado + " (solo demostración)"); return; }
  const { error } = await db.from("reportes").update({ estado }).eq("id", id);
  if (error) { r.estado = anterior; render(); toast("No se pudo cambiar el estado: " + error.message); }
  else toast("Caso #" + id + " marcado como " + estado);
}

async function eliminarCaso(id) {
  const r = reportes.find(x => x.id === id);
  if (!r) return;
  if (!DEMO) {
    const { data, error } = await db.from("reportes").delete().eq("id", id).select();
    if (error) { toast("No se pudo eliminar: " + error.message); return; }
    if (!data || !data.length) { toast("No se pudo eliminar el caso (revisa los permisos de la tabla en Supabase)."); return; }
  }
  reportes = reportes.filter(x => x.id !== id);
  delete manuales[id]; guardarManuales();
  render();
  toast("Caso #" + id + " eliminado" + (DEMO ? " (solo demostración)" : ""));
}

let casoAEliminar = null;
function pedirEliminar(id) {
  const r = reportes.find(x => x.id === id);
  if (!r) return;
  casoAEliminar = id;
  $("confirmar-texto").textContent = "#" + id + " · " + (r.titulo || "Sin título");
  $("confirmar").classList.remove("hidden");
  $("confirmar-no").focus();
}
function cerrarConfirmar() { casoAEliminar = null; $("confirmar").classList.add("hidden"); }
$("confirmar-no").addEventListener("click", cerrarConfirmar);
$("confirmar").addEventListener("click", e => { if (e.target === $("confirmar")) cerrarConfirmar(); });
$("confirmar-si").addEventListener("click", () => { const id = casoAEliminar; cerrarConfirmar(); if (id !== null) eliminarCaso(id); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && casoAEliminar !== null) cerrarConfirmar(); });

// ---------- Urgencia ----------
const clamp01 = n => Math.min(1, Math.max(0, n));
let manuales = {};
try { manuales = JSON.parse(localStorage.getItem("urgencias_manual") || "{}"); } catch (_) {}
const guardarManuales = () => { try { localStorage.setItem("urgencias_manual", JSON.stringify(manuales)); } catch (_) {} };
const urgenciaAuto = r => clamp01((Date.now() - new Date(r.created_at)) / SEMANA);
// Valor fijado a mano: columna "urgencia" de Supabase si existe, o el guardado en este navegador
const urgenciaManual = r => typeof r.urgencia === "number" ? clamp01(r.urgencia) : (r.id in manuales ? clamp01(manuales[r.id]) : null);
const urgencia = r => urgenciaManual(r) ?? urgenciaAuto(r);

async function fijarUrgencia(id, valor) {
  const r = reportes.find(x => x.id === id);
  if (!r) return;
  if (valor === null) delete manuales[id]; else manuales[id] = valor;
  guardarManuales();
  if ("urgencia" in r) {            // la tabla tiene la columna: se comparte con todo el staff
    r.urgencia = valor;
    if (!DEMO) {
      const { error } = await db.from("reportes").update({ urgencia: valor }).eq("id", id);
      if (error) toast("No se pudo guardar la temperatura: " + error.message);
    }
  }
}

function hace(ms) {
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return "Hace " + d + (d === 1 ? " día" : " días");
  if (h >= 1) return "Hace " + h + (h === 1 ? " hora" : " horas");
  return m < 1 ? "Ahora mismo" : "Hace " + m + " min";
}

function barraHTML(r, resuelto) {
  const u = urgencia(r);
  const manual = urgenciaManual(r) !== null;
  const color = `hsl(${Math.round(210 * (1 - u))} 85% 55%)`;
  const edad = Date.now() - new Date(r.created_at);
  const texto = resuelto ? "Resuelto" : (edad >= SEMANA ? "Más de una semana sin resolver" : hace(edad));
  const nivel = Math.round(u * 100);
  return `
    <div class="${resuelto ? "opacity-40" : ""}">
      <div class="barra-urg py-2 -my-2 cursor-pointer select-none" style="touch-action:none" data-id="${r.id}"
        role="slider" aria-label="Temperatura del caso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${nivel}"
        aria-valuetext="${nivel}% (frío a caliente)" tabindex="0">
        <div class="pista relative h-2 rounded-full" style="background:linear-gradient(90deg,#3b82f6,#a855f7 50%,#ef4444)">
          <span class="pulgar absolute top-1/2 w-5 h-5 rounded-full border-2 border-white shadow-lg cursor-grab"
            style="left:${(u * 100).toFixed(1)}%;transform:translate(-50%,-50%);background:${color}"></span>
        </div>
      </div>
      <div class="flex justify-between items-center text-xs text-slate-500 mt-2.5 gap-2">
        <span class="text-blue-300">❄ Frío</span>
        <span class="text-slate-300 text-center">${esc(texto)}${manual ? ` · <button data-reset-urg="${r.id}" class="underline text-slate-400 hover:text-white" title="Volver al cálculo automático por tiempo">auto</button>` : ""}</span>
        <span class="text-red-300">Caliente 🔥</span>
      </div>
    </div>`;
}

// ---------- Render ----------
function pruebasHTML(texto) {
  const items = String(texto).split(/\s+/).filter(Boolean).map(t => {
    try {
      const u = new URL(t);
      if (u.protocol === "http:" || u.protocol === "https:") {
        return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer"
          class="inline-flex items-center gap-2 bg-fx/10 text-fx border border-fx/30 hover:bg-fx/20 rounded-lg px-3 py-1.5 text-sm font-medium transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          Ver prueba</a>`;
      }
    } catch (_) {}
    return `<span class="text-sm text-slate-400 break-all">${esc(t)}</span>`;
  });
  return `<div class="flex flex-wrap items-center gap-2">${items.join("")}</div>`;
}

  return `
  <article class="card relative overflow-hidden rounded-xl border border-line bg-panel p-4 sm:p-5" style="--c:${tipo.rgb}">
    <div class="absolute inset-0 pointer-events-none" style="background:radial-gradient(520px 160px at 0% 0%, rgba(${tipo.rgb},.14), transparent 70%)"></div>
    <div class="relative">
      <div class="flex flex-wrap items-center gap-2.5">

          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
        </span>
        <span class="px-3 py-1 rounded-full text-xs font-semibold ring-1 ${tipo.badge}">${esc(r.tipo_reporte || "Otro")}</span>
        <span class="ml-auto text-xs text-slate-500">#${esc(r.id)} · ${fecha}</span>
        <button data-borrar="${r.id}" title="Eliminar caso" aria-label="Eliminar caso #${esc(r.id)}"
          class="-mr-1 p-1.5 rounded-md text-slate-500 hover:text-red-300 hover:bg-red-500/15 transition-colors">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>

      <h3 class="font-display text-2xl font-bold text-white leading-tight mt-4">${esc(r.titulo || "Sin título")}</h3>
      <div class="flex items-center gap-2.5 mt-2">
        <span class="w-7 h-7 rounded-full grid place-items-center text-xs font-bold text-black" style="background:rgb(${tipo.rgb})">${esc((r.usuario_discord || "?").charAt(0).toUpperCase())}</span>
        <span class="text-sm text-slate-200 font-medium">${esc(r.usuario_discord || "Anónimo")}</span>

function render() {
  if ((drag && drag.activo) || deslizando) { renderPendiente = true; return; }
  $("tabs").innerHTML = VISTAS.map(v => {
    const n = v.id === "Todos" ? reportes.length : reportes.filter(r => r.tipo_reporte === v.id).length;
    const activa = v.id === filtro;
    return `<button data-vista="${v.id}" aria-current="${activa}"
      class="tab flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-left whitespace-nowrap font-medium transition-colors md:w-full ${activa ? "bg-raised text-white ring-1 ring-line" : "text-slate-400 hover:text-white hover:bg-raised/60"}">
      <span class="w-2.5 h-2.5 rounded-full ${v.dot}"></span><span>${v.label}</span>
      <span class="ml-auto text-xs ${activa ? "text-fx" : "text-slate-500"}">${n}</span></button>`;
  }).join("");

  $("titulo-vista").textContent = VISTAS.find(v => v.id === filtro).label;

  const visibles = (filtro === "Todos" ? reportes : reportes.filter(r => r.tipo_reporte === filtro)).slice();
  visibles.sort((a, b) => orden === "prioridad"
    ? (urgencia(b) - urgencia(a)) || (new Date(a.created_at) - new Date(b.created_at))   // el más caliente arriba
    : new Date(b.created_at) - new Date(a.created_at));

  const COL = {
    "Pendiente":   { dot: "bg-slate-400",   vacio: "Nada pendiente por ahora." },
    "En revisión": { dot: "bg-violet-400",  vacio: "Ningún caso en revisión." },
    "Resuelto":    { dot: "bg-emerald-400", vacio: "Aún no hay casos resueltos." }
  };
  $("lista").innerHTML = ESTADOS.map(e => {
    const items = visibles.filter(r => (ESTADOS.includes(r.estado) ? r.estado : "Pendiente") === e);
    return `
    <section class="min-w-0 shrink-0 w-[min(85vw,24rem)] lg:w-auto self-stretch rounded-2xl bg-panel/40 border border-line/60 p-3" aria-label="${e}" data-estado="${e}">
      <div class="flex items-center gap-2.5 mb-3 px-1">
        <span class="w-2.5 h-2.5 rounded-full ${COL[e].dot}"></span>
        <h2 class="font-display text-2xl font-bold text-white leading-none">${e}</h2>
        <span class="ml-auto text-sm text-slate-300 bg-panel border border-line rounded-full px-2.5 py-0.5">${items.length}</span>
      </div>
      <div class="flex flex-col gap-4 min-h-[8rem]">${items.length ? items.map(t => `<div class="card-wrap w-full" data-card-id="${t.id}">${tarjeta(t)}</div>`).join("")
        : `<div class="w-full border border-dashed border-line rounded-xl p-8 text-center text-sm text-slate-500">${COL[e].vacio}</div>`}</div>
    </section>`;
  }).join("");
}

// ---------- Arrastrar y soltar ----------
let drag = null, renderPendiente = false, bloquearClick = false;

function seccionBajo(x, y) {
  const el = document.elementFromPoint(x, y);
  return el ? el.closest("section[data-estado]") : null;
}

function marcarDestino(sec) {
  document.querySelectorAll("section.drop-activa").forEach(s => { if (s !== sec) s.classList.remove("drop-activa"); });
  if (sec) sec.classList.add("drop-activa");
}

function autoscroll() {
  if (!drag || !drag.activo) return;
  const m = 90, y = drag.y;
  if (y < m) window.scrollBy(0, -Math.ceil((m - y) / 6));
  else if (y > innerHeight - m) window.scrollBy(0, Math.ceil((y - (innerHeight - m)) / 6));
  // desplazamiento horizontal dentro de la fila bajo el cursor
  const fila = $("lista");
  if (fila && fila.scrollWidth > fila.clientWidth) {
    const r = fila.getBoundingClientRect();
    if (drag.x < r.left + 60) fila.scrollLeft -= 12;
    else if (drag.x > r.right - 60) fila.scrollLeft += 12;
  }
  drag.raf = requestAnimationFrame(autoscroll);
}

function moverGhost() {
  drag.ghost.style.transform = `translate(${drag.x - drag.dx}px, ${drag.y - drag.dy}px) rotate(2deg)`;
}

function finArrastre(soltar) {
  if (!drag) return;
  const d = drag; drag = null;
  document.removeEventListener("pointermove", onMove);
  document.removeEventListener("pointerup", onUp);
  document.removeEventListener("pointercancel", onCancel);
  if (d.activo) {
    cancelAnimationFrame(d.raf);
    d.ghost.remove();
    d.origen.classList.remove("drag-origen");
    document.body.classList.remove("arrastrando");
    marcarDestino(null);
    bloquearClick = true; setTimeout(() => bloquearClick = false, 0);
    if (soltar) {
      const sec = seccionBajo(d.x, d.y);
      if (sec) cambiarEstado(d.id, sec.dataset.estado);
    }
    if (renderPendiente) { renderPendiente = false; render(); }
  }
}

function onMove(e) {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.activo) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    const r = drag.origen.getBoundingClientRect();
    drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
    const g = drag.origen.cloneNode(true);
    g.className = "drag-ghost"; g.style.width = r.width + "px";
    document.body.appendChild(g);
    drag.ghost = g; drag.activo = true;
    drag.origen.classList.add("drag-origen");
    document.body.classList.add("arrastrando");
    getSelection()?.removeAllRanges();
    drag.raf = requestAnimationFrame(autoscroll);
  }
  e.preventDefault();
  moverGhost();
  marcarDestino(seccionBajo(e.clientX, e.clientY));
}
const onUp = () => finArrastre(true);
const onCancel = () => finArrastre(false);

document.addEventListener("pointerdown", e => {
  if (drag || e.button !== 0) return;
  const wrap = e.target.closest(".card-wrap");
  if (!wrap || e.target.closest("a, button, select, input, textarea, .barra-urg")) return;
  // En pantallas táctiles solo se arrastra desde el icono de agarre (para poder seguir haciendo scroll)
  if (e.pointerType === "touch" && !e.target.closest(".grip")) return;
  drag = { id: Number(wrap.dataset.cardId), origen: wrap, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, activo: false };
  document.addEventListener("pointermove", onMove, { passive: false });
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onCancel);
});

// ---------- Barra de temperatura (deslizable) ----------
let deslizando = false;

function valorDesdeX(pista, x) {
  const r = pista.getBoundingClientRect();
  return clamp01((x - r.left) / r.width);
}
function pintarBarra(barra, u) {
  const pulgar = barra.querySelector(".pulgar");
  pulgar.style.left = (u * 100).toFixed(1) + "%";
  pulgar.style.background = `hsl(${Math.round(210 * (1 - u))} 85% 55%)`;
  barra.setAttribute("aria-valuenow", Math.round(u * 100));
}
function terminarDeslizar() {
  deslizando = false;
  if (renderPendiente) { renderPendiente = false; render(); }
}

document.addEventListener("pointerdown", e => {
  const barra = e.target.closest(".barra-urg");
  if (!barra || e.button !== 0) return;
  e.preventDefault();
  const id = Number(barra.dataset.id), pista = barra.querySelector(".pista");
  deslizando = true;
  let u = valorDesdeX(pista, e.clientX);
  pintarBarra(barra, u);
  barra.setPointerCapture(e.pointerId);
  const mover = ev => { u = valorDesdeX(pista, ev.clientX); pintarBarra(barra, u); };
  const fin = () => {
    barra.removeEventListener("pointermove", mover);
    barra.removeEventListener("pointerup", fin);
    barra.removeEventListener("pointercancel", fin);
    fijarUrgencia(id, u);
    terminarDeslizar(); render();
  };
  barra.addEventListener("pointermove", mover);
  barra.addEventListener("pointerup", fin);
  barra.addEventListener("pointercancel", fin);
});

// Teclado: flechas izquierda/derecha
document.addEventListener("keydown", e => {
  const barra = e.target.closest?.(".barra-urg");
  if (!barra || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  e.preventDefault();
  const id = Number(barra.dataset.id), r = reportes.find(x => x.id === id);
  if (!r) return;
  fijarUrgencia(id, clamp01(urgencia(r) + (e.key === "ArrowRight" ? 0.05 : -0.05)));
  render();
  document.querySelector(`.barra-urg[data-id="${id}"]`)?.focus();
});

document.addEventListener("click", e => {
  const borrar = e.target.closest("[data-borrar]");
  if (borrar) { pedirEliminar(Number(borrar.dataset.borrar)); return; }
  const reset = e.target.closest("[data-reset-urg]");
  if (reset) { fijarUrgencia(Number(reset.dataset.resetUrg), null); render(); return; }
  if (bloquearClick) { e.preventDefault(); e.stopPropagation(); return; }
  const tab = e.target.closest(".tab");
  if (tab) { filtro = tab.dataset.vista; render(); return; }
  const btn = e.target.closest(".estado-btn");
  if (btn) cambiarEstado(Number(btn.dataset.id), btn.dataset.estado);
});

// ---------- Arranque ----------
$("live-box").classList.remove("hidden");
render();
cargar();
setInterval(render, 60000);
</script>
